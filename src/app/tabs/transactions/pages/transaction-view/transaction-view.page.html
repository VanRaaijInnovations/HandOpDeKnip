<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Transaction</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if ($transaction | async) {
  <ion-list>
    <ion-item>
      <ion-label>
        Date: {{ ($transaction | async)?.date | date: 'short' }}
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        Amount: {{ ($transaction | async)?.amount | currency }}
      </ion-label>
    </ion-item>
  </ion-list>
  }
</ion-content>
